[package]
name = "airpods-head-track"
version = "0.1.0"
edition = "2021"
description = "AirPods head tracking on Windows with OpenTrack output"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
windows = { version = "0.54", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
]}
